name: Release

# A tag is the release: pushing one builds the Linux packages and publishes them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: never

    # The version comes from the tag, not from the build file: a release that
    # disagrees with its tag is worse than one that cannot be built. The build
    # file's own version is what a plain `./gradlew build` produces.
    - name: Take the version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ -n "${VERSION}" ] || { echo "error: tag ${GITHUB_REF_NAME} has no version" >&2; exit 1; }
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "Releasing ${VERSION}"

    - name: Build with Gradle
      run: xvfb-run --auto-servernum ./gradlew clean build -PreleaseVersion=${{ env.VERSION }} --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    # appimagetool is an AppImage itself; the released one is used rather than a
    # distribution package so the packages are built by the same tool everywhere.
    - name: Fetch appimagetool
      run: |
        curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x "$RUNNER_TEMP/appimagetool"
        echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> $GITHUB_ENV

    - name: Build the Linux packages
      run: |
        ./packaging/linux-packages.sh \
          "${{ env.VERSION }}" \
          "build/libs/hdsl-${{ env.VERSION }}.sh" \
          "src/main/resources/assets/img/icon@8x.png" \
          build/libs

    - name: Write the release note
      run: |
        echo "HMCL-DSH ${VERSION} — DeepSeek Harness launcher for Linux." >> RELEASE_NOTE
        echo "" >> RELEASE_NOTE
        echo "Requires a Java 21 or newer runtime (no JVM is bundled), the same as the \`.deb\` declares." >> RELEASE_NOTE
        echo "" >> RELEASE_NOTE
        echo "| File | SHA-256 |" >> RELEASE_NOTE
        echo "| --- | --- |" >> RELEASE_NOTE
        for file in "hdsl-${VERSION}-linux-x64.tar.zst" "HDSL-${VERSION}-x86_64.AppImage" "hdsl-${VERSION}.deb"; do
          echo "| [${file}](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${file}) | \`$(cut -d' ' -f1 < "build/libs/${file}.sha256" 2>/dev/null || echo pending)\` |" >> RELEASE_NOTE
        done
        cat RELEASE_NOTE

    - name: Sum the deb
      run: |
        ( cd build/libs && sha256sum "hdsl-${VERSION}.deb" > "hdsl-${VERSION}.deb.sha256" )

    - name: Create the release
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          "build/libs/hdsl-${VERSION}-linux-x64.tar.zst" \
          "build/libs/hdsl-${VERSION}-linux-x64.tar.zst.sha256" \
          "build/libs/HDSL-${VERSION}-x86_64.AppImage" \
          "build/libs/HDSL-${VERSION}-x86_64.AppImage.sha256" \
          "build/libs/hdsl-${VERSION}.deb" \
          "build/libs/hdsl-${VERSION}.deb.sha256" \
          "build/libs/hdsl-${VERSION}.sh" \
          --target "${{ github.sha }}" \
          --title "HMCL-DSH ${VERSION}" \
          --notes-file RELEASE_NOTE
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
