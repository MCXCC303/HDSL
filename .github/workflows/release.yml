name: Release

# A tag is the release: pushing one builds the Linux and macOS packages and publishes them.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: never

    # The version comes from the tag, not from the build file: a release that
    # disagrees with its tag is worse than one that cannot be built. The build
    # file's own version is what a plain `./gradlew build` produces.
    - name: Take the version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ -n "${VERSION}" ] || { echo "error: tag ${GITHUB_REF_NAME} has no version" >&2; exit 1; }
        # A pre-release part — anything after the first `-`, which is semver's own spelling for one —
        # makes this a pre-release rather than a release. GitHub keeps those out of `releases/latest`,
        # so the download page and anything reading that endpoint stay on the stable release while the
        # snapshot's assets remain reachable by tag for whoever is testing it.
        case "${VERSION}" in
          *-*) PRERELEASE=--prerelease ;;
          *)   PRERELEASE= ;;
        esac
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "PRERELEASE=${PRERELEASE}" >> $GITHUB_ENV
        echo "Releasing ${VERSION}${PRERELEASE:+ (pre-release)}"

    - name: Build with Gradle
      run: xvfb-run --auto-servernum ./gradlew clean build -PreleaseVersion=${{ env.VERSION }} --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    # appimagetool is an AppImage itself; the released one is used rather than a
    # distribution package so the packages are built by the same tool everywhere.
    - name: Fetch appimagetool
      run: |
        curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x "$RUNNER_TEMP/appimagetool"
        echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> $GITHUB_ENV

    - name: Build the Linux packages
      run: |
        set -o pipefail
        # `dist/`, not `build/libs`: `build/` belongs to Gradle and any rebuild empties it, which is
        # how a release's artifacts came to vanish between being built and being uploaded.
        log="$RUNNER_TEMP/linux-packages.log"
        ./packaging/linux-packages.sh \
          "${{ env.VERSION }}" \
          "build/libs/hdsl-${{ env.VERSION }}.sh" \
          "src/main/resources/assets/img/icon@8x.png" \
          dist | tee "${log}"
        # The Arch package's name is read back from the script rather than rebuilt here: it is the
        # version pacman is given, and for a pre-release that differs from the tag's.
        arch_path="$(sed -n 's/^arch package: //p' "${log}")"
        [ -n "${arch_path}" ] || { echo "error: the packaging script named no Arch package" >&2; exit 1; }
        echo "ARCH_PKG=$(basename "${arch_path}")" >> $GITHUB_ENV
        # The two Gradle writes go beside them, so one directory holds the whole release.
        cp "build/libs/hdsl-${{ env.VERSION }}.sh" "build/libs/hdsl-${{ env.VERSION }}.deb" dist/

    - name: Write the release note
      run: |
        echo "HDSL ${VERSION} — DeepSeek Harness launcher for Linux and macOS." >> RELEASE_NOTE
        echo "" >> RELEASE_NOTE
        if [ -n "${PRERELEASE}" ]; then
          echo "This is a **pre-release**: it is not the latest release, and nothing asking for the" >> RELEASE_NOTE
          echo "latest version will be offered it." >> RELEASE_NOTE
          echo "" >> RELEASE_NOTE
        fi
        echo "Requires a Java 21 or newer runtime (no JVM is bundled), the same as the \`.deb\` declares." >> RELEASE_NOTE
        echo "macOS users take the .dmg or .zip; the standalone .sh below is the Linux build." >> RELEASE_NOTE
        echo "" >> RELEASE_NOTE
        echo "| File | For | SHA-256 |" >> RELEASE_NOTE
        echo "| --- | --- | --- |" >> RELEASE_NOTE
        # The Arch package is listed like the others. It is not the tar.zst under another name:
        # `pacman -U` reads `.PKGINFO` out of the archive, so only a real pacman package installs,
        # and the portable tar.zst is for unpacking anywhere.
        for file in "hdsl-${VERSION}-linux-x64.tar.zst" "${ARCH_PKG}" "HDSL-${VERSION}-x86_64.AppImage" "hdsl-${VERSION}.deb" "hdsl-${VERSION}.sh" "HDSL-${VERSION}-aarch64.dmg" "HDSL-${VERSION}-aarch64.zip" "HDSL-${VERSION}-x64.dmg" "HDSL-${VERSION}-x64.zip"; do
          echo "| [${file}](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${file}) | $(case "${file}" in *.pkg.tar.zst) echo "Arch (\`pacman -U\`)";; *.tar.zst) echo "portable (unpack anywhere)";; *.AppImage) echo "portable (single file)";; *.deb) echo "Debian / Ubuntu";; *.dmg) echo "macOS (mount)";; *.zip) echo "macOS (unpack)";; *.sh) echo "self-executing";; esac) | \`$(cut -d' ' -f1 < "dist/${file}.sha256" 2>/dev/null || echo pending)\` |" >> RELEASE_NOTE
        done
        cat RELEASE_NOTE

    - name: Sum the Gradle artifacts
      run: |
        # The two files Gradle wrote are the ones the packaging script does not build, so their sums
        # are written here, one per artifact as everywhere else: the release note reads every checksum
        # from `dist/`, and the `.sh` row said `pending` for a file that was in the directory.
        for artifact in "hdsl-${VERSION}.deb" "hdsl-${VERSION}.sh"; do
          ( cd dist && sha256sum "${artifact}" > "${artifact}.sha256" )
        done

    - name: Create the release
      run: |
        # The assets are listed by glob rather than by name so that a file the runner did not build is
        # simply absent: `gh release create` fails the whole release over one path that does not exist,
        # and the AppImage depends on a tool fetched over the network.
        gh release create "${GITHUB_REF_NAME}" \
          dist/hdsl-${VERSION}-linux-x64.tar.zst \
          dist/hdsl-${VERSION}-linux-x64.tar.zst.sha256 \
          "dist/${ARCH_PKG}" \
          "dist/${ARCH_PKG}.sha256" \
          dist/HDSL-${VERSION}-x86_64.AppImage \
          dist/HDSL-${VERSION}-x86_64.AppImage.sha256 \
          dist/hdsl-${VERSION}.deb \
          dist/hdsl-${VERSION}.deb.sha256 \
          dist/hdsl-${VERSION}.sh \
          dist/hdsl-${VERSION}.sh.sha256 \
          --target "${{ github.sha }}" \
          ${PRERELEASE} \
          --title "HDSL ${VERSION}" \
          --notes-file RELEASE_NOTE
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The macOS bundle embeds the host's JavaFX platform, so it is built where
  # it runs rather than beside the Linux packages — once per Mac arch, with
  # macos-latest covering Apple Silicon and macos-26-intel covering Intel.
  #
  # Deliberately no `needs: release`. A release is created by one job and added
  # to by the other, and `gh release upload` is incremental, so nothing here
  # depends on the Linux job having run first. Waiting for it would only mean
  # that a Mac failure leaves a published release missing half its assets —
  # the release goes public the moment the Linux job creates it, whether or not
  # this job succeeds afterwards.
  release-mac:

    strategy:
      matrix:
        os: [macos-latest, macos-26-intel]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: never

    - name: Take the version from the tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        [ -n "${VERSION}" ] || { echo "error: tag ${GITHUB_REF_NAME} has no version" >&2; exit 1; }
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "Releasing ${VERSION}"

    - name: Build with Gradle
      run: ./gradlew clean build -PreleaseVersion=${{ env.VERSION }} --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    - name: Build the macOS packages
      run: |
        # `dist/`, not `build/libs`, for the same reason the Linux side uses it: the
        # release note reads every artifact's checksum from one directory, and the
        # macOS packages belong in it beside the rest.
        ./packaging/mac-packages.sh \
          "${{ env.VERSION }}" \
          "build/libs/hdsl-${{ env.VERSION }}.sh" \
          "src/main/resources/assets/img/icon@8x.png" \
          dist

    - name: Upload the macOS packages
      run: |
        gh release upload "${GITHUB_REF_NAME}" \
          dist/HDSL-${{ env.VERSION }}-*.dmg \
          dist/HDSL-${{ env.VERSION }}-*.dmg.sha256 \
          dist/HDSL-${{ env.VERSION }}-*.zip \
          dist/HDSL-${{ env.VERSION }}-*.zip.sha256 \
          --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
