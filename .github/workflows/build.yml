name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

# The failing-tests comment is posted with the build's own token; everything
# else only reads.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        # One job per supported platform, each building with its own JavaFX
        # natives and packaging its own artifacts. The tests that need the
        # toolkit run under xvfb on Linux; the Windows and macOS runners' own
        # desktop session is what they run under there. macos-latest is Apple
        # Silicon and macos-26-intel is Intel: the two Macs the launcher supports.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Set up Node 22
      # The lifecycle tests start instances through the system Node; the range
      # the launcher accepts (^22.19.0 || >=24.0.0) is what the runners have to
      # hold for them to run rather than skip.
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Set up pnpm
      # `dsh plugin` forwards to pnpm, so the launcher refuses to install a plugin
      # on a machine without it — and the tests that cover installing one, and
      # approving the install scripts it asks about, are skipped there. The
      # launcher provisions a pnpm of its own for the instances a user makes; a
      # runner has none, so it is put on PATH here.
      run: npm install --global pnpm
    - name: Install test dependencies (Linux)
      # JavaFX needs GTK even under xvfb; without it the toolkit wedges and the
      # tests hang rather than fail. The t64 name is the one newer Ubuntu uses.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libgtk-3-0t64 libgl1 || sudo apt-get install -y xvfb libgtk-3-0 libgl1
    # Each build is bounded, so a runner that cannot get through it reports
    # inside half an hour instead of being held. The bound is a net under the
    # suite's own: a healthy build here takes one to three minutes, and the
    # longest a wedged toolkit can cost is the startup bound the tests carry.
    - name: Build with Gradle (Linux)
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      if: runner.os == 'Linux'
      timeout-minutes: 30
    - name: Build with Gradle (macOS)
      # A macOS runner has a desktop session of its own, so the toolkit tests run
      # there as they are.
      if: runner.os == 'macOS'
      run: ./gradlew build --no-daemon --parallel
      timeout-minutes: 30
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    - name: Build with Gradle (Windows)
      # PowerShell runs nothing from the working directory without its path,
      # which is what the backslash is for; the runner's own desktop session
      # is what the JavaFX tests run under.
      run: .\gradlew.bat build --no-daemon --parallel
      if: runner.os == 'Windows'
      timeout-minutes: 30
    - name: Get short SHA
      shell: bash
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    # The .sh embeds the host's JavaFX platform, so one per OS is kept.
    - name: Upload SH
      uses: actions/upload-artifact@v7
      if: runner.os == 'Linux'
      with:
        name: HDSL-${{ env.SHORT_SHA }}-sh-${{ matrix.os }}
        path: build/libs/hdsl-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      if: runner.os == 'Linux'
      with:
        name: HDSL-${{ env.SHORT_SHA }}-deb
        path: build/libs/hdsl-*.deb
        archive: false
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      if: runner.os == 'Windows'
      with:
        name: HDSL-${{ env.SHORT_SHA }}-exe
        path: build/libs/hdsl-*.exe
        archive: false
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      if: runner.os == 'Windows'
      with:
        name: HDSL-${{ env.SHORT_SHA }}-jar
        path: build/libs/hdsl-*.jar
        archive: false
