name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: never
    # The launcher is a JavaFX application, and a few of its tests touch the
    # toolkit; a headless server needs a display for them.
    - name: Build with Gradle
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload SH
      uses: actions/upload-artifact@v4
      with:
        name: HDSL-${{ env.SHORT_SHA }}-sh
        path: build/libs/hdsl-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v4
      with:
        name: HDSL-${{ env.SHORT_SHA }}-deb
        path: build/libs/hdsl-*.deb
        archive: false
