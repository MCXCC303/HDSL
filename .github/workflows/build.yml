name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: never
    # The launcher is a JavaFX application, and a few of its tests touch the
    # toolkit; a headless Linux server needs a display for them, while macOS
    # builds run as they are.
    - name: Build with Gradle (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    - name: Build with Gradle (macOS)
      if: runner.os == 'macOS'
      run: ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    # The .sh embeds the host's JavaFX platform, so one per OS is kept.
    - name: Upload SH
      uses: actions/upload-artifact@v4
      with:
        name: HDSL-${{ env.SHORT_SHA }}-sh-${{ matrix.os }}
        path: build/libs/hdsl-*.sh
        archive: false
    - name: Upload DEB
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: HDSL-${{ env.SHORT_SHA }}-deb
        path: build/libs/hdsl-*.deb
        archive: false
