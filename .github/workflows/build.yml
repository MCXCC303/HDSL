name: Java CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-26-intel ]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          npm install --global pnpm@11.24.0
          pnpm --version
      - name: Install test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libgl1 || sudo apt-get install -y xvfb libgtk-3-0 libgl1

      - name: Build with Gradle (Linux)
        run: xvfb-run --auto-servernum ./gradlew build -Pexternal --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        if: runner.os == 'Linux'
        timeout-minutes: 30
      - name: Build with Gradle (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew build -Pexternal --no-daemon --parallel
        timeout-minutes: 30
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
      - name: Build with Gradle (Windows)
        run: .\gradlew.bat build -Pexternal --no-daemon --parallel
        if: runner.os == 'Windows'
        timeout-minutes: 30

      - name: Get short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Upload SH
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: HDSL-${{ env.SHORT_SHA }}-sh-${{ matrix.os }}
          path: build/libs/hdsl-*.sh
          archive: false
      - name: Upload DEB
        uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: HDSL-${{ env.SHORT_SHA }}-deb
          path: build/libs/hdsl-*.deb
          archive: false
      - name: Upload EXE
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: HDSL-${{ env.SHORT_SHA }}-exe
          path: build/libs/hdsl-*.exe
          archive: false
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: HDSL-${{ env.SHORT_SHA }}-jar
          path: build/libs/hdsl-*.jar
          archive: false
