game.crash.reason.entity=تعطّلت اللعبة بسبب كيان في العالم.\n\
   \n\
   يمكنك محاولة إزالة الكيان باستخدام <a href="https://minecraft.wiki/w/Tutorial:Programs_and_editors/Mapping#Map_editors">محررات الخرائط</a> أو حذف المود الذي أضافه.\n\
