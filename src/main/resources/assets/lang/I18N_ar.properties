game.crash.reason.debug_crash=تعطّلت اللعبة لأنك أثرت ذلك يدوياً. إذاً أنت على الأرجح تعرف السبب :)
game.crash.reason.duplicated_mod=لا تستطيع اللعبة الاستمرار بسبب تكرار المودات "%1$s".\n\
