fatal.create_hmcl_current_directory_failure=لا يستطيع HMCL إنشاء مجلد HMCL (%s). يُرجى نقل HMCL إلى موقع آخر وإعادة تشغيله.
fatal.javafx.incomplete=بيئة JavaFX غير مكتملة.\n\
   يُرجى محاولة استبدال Java أو إعادة تثبيت OpenJFX.
fatal.javafx.missing=بيئة JavaFX مفقودة. يُرجى فتح HMCL باستخدام Java الذي يتضمن OpenJFX.
fatal.config_change_owner_root=أنت تستخدم حساب الجذر لفتح HMCL. قد يمنعك ذلك من فتح HMCL بحساب آخر في المستقبل.\n\
   هل تريد المتابعة؟
fatal.config_in_temp_dir=أنت تفتح HMCL في مجلد مؤقت. قد تُفقد إعداداتك وبيانات اللعبة.\n\
   يُنصح بنقل HMCL إلى موقع آخر وإعادة تشغيله.\n\
   هل تريد المتابعة؟
fatal.config_loading_failure=لا يمكن تحميل ملفات الإعدادات.\n\
   يُرجى التأكد من أن HMCL يملك صلاحيات القراءة والكتابة على "%s" والملفات الموجودة فيه.\n\
   لمستخدمي macOS، جرّب وضع HMCL في موقع بصلاحيات غير "سطح المكتب" و"التنزيلات" و"المستندات" وأعد المحاولة.
fatal.config_loading_failure.unix=لا يستطيع HMCL تحميل ملف الإعدادات لأنه أُنشئ بواسطة المستخدم "%1$s".\n\
   يُرجى فتح HMCL كمستخدم جذر (غير موصى به)، أو تنفيذ الأمر التالي في الطرفية لتغيير ملكية ملف الإعدادات إلى المستخدم الحالي:\n%2$s
fatal.config_unsupported_version=ملف الإعدادات الحالي أُنشئ بواسطة إصدار أحدث من HMCL، ولا يستطيع هذا الإصدار من HMCL تحميله بشكل صحيح.\n\
   يُرجى تحديث HMCL وإعادة تشغيله.\n\
   قبل تحديث المشغّل، لن يتم حفظ أي إعدادات تقوم بتعديلها.
fatal.mac_app_translocation=تم عزل HMCL في مجلد مؤقت بواسطة نظام التشغيل بسبب آليات أمان macOS.\n\
   يُرجى نقل HMCL إلى مجلد آخر قبل محاولة الفتح. وإلا، قد تُفقد إعداداتك وبيانات اللعبة بعد إعادة التشغيل.\n\
   هل تريد المتابعة؟
fatal.migration_requires_manual_reboot=تم ترقية HMCL. يُرجى إعادة تشغيل المشغّل.
fatal.apply_update_failure=نأسف، لكن HMCL غير قادر على التحديث التلقائي.\n\
   \n\
   يمكنك التحديث يدوياً بتنزيل إصدار أحدث من المشغّل من %s.\n\
   إذا استمرت المشكلة، يُرجى إرسال تقرير عنها إلينا.
fatal.apply_update_need_win7=لا يستطيع HMCL التحديث التلقائي على Windows XP/Vista.\n\
   \n\
   يمكنك التحديث يدوياً بتنزيل إصدار أحدث من المشغّل من %s.
fatal.deprecated_java_version=سيتطلب HMCL Java 17 أو أحدث للتشغيل في المستقبل، لكنه سيستمر في دعم تشغيل الألعاب باستخدام Java 6~16.\n\
\n\
يُنصح بتثبيت أحدث إصدار من Java لضمان عمل HMCL بشكل صحيح.\n\
\n\
يمكنك الاحتفاظ بإصدار Java القديم. يستطيع HMCL التعرف على إصدارات Java المتعددة وإدارتها وسيختار تلقائياً Java المناسب بناءً على إصدار اللعبة.
fatal.deprecated_java_version.download_link=تنزيل Java %d
fatal.samba=إذا فتحت HMCL من محرك أقراص شبكة Samba، قد لا تعمل بعض الميزات. يُرجى محاولة تحديث Java أو نقل المشغّل إلى مجلد آخر.
fatal.illegal_char=مسار المستخدم الخاص بك يحتوي على حرف غير مسموح به "=". لن تتمكن من استخدام authlib-injector أو تغيير مظهر حسابك غير المتصل.
fatal.unsupported_platform=لا يدعم Minecraft منصتك الحالية بشكل كامل بعد، لذا قد تواجه ميزات مفقودة أو عدم القدرة على تشغيل اللعبة.\n\
   \n\
   إذا لم تتمكن من تشغيل Minecraft 1.17 أو أحدث، يمكنك محاولة تغيير "المُصيِّر" إلى "Mesa LLVMpipe" في "الإعدادات العامة/الخاصة بالنسخة ← الإعدادات المتقدمة" لاستخدام معالجة المعالج المركزي لتوافق أفضل.
fatal.unsupported_platform.loongarch=وفّر HMCL دعماً لمنصة Loongson.\n\
   إذا واجهت مشاكل أثناء اللعب، يمكنك زيارة https://docs.hmcl.net/groups.html للحصول على مساعدة.
fatal.unsupported_platform.windows_arm64=وفّر HMCL دعماً أصلياً لمنصة Windows on Arm. إذا واجهت مشاكل أثناء اللعب، يُرجى محاولة تشغيل اللعبة بـ Java المبني على معمارية x86.\n\
   \n\
   إذا كنت تستخدم منصة <b>Qualcomm</b>، قد تحتاج إلى تثبيت <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">حزمة توافق OpenGL</a> قبل اللعب.\n\
   انقر على الرابط للانتقال إلى Microsoft Store وتثبيت حزمة التوافق.
